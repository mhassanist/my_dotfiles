# Tools a coding project needs. `ai-setup` checks them in every repo and only warns or
# recommends: it never installs anything.
#
# LEVEL        WHEN     TOOL                        HOW TO INSTALL
#   LEVEL  required (✗ if missing) | recommended (! if missing)
#   WHEN   all | flutter (only in repos with a pubspec.yaml)
#   TOOL   a command on PATH, or plugin:<name> for a Claude Code plugin

required     all      gitleaks                    brew install gitleaks
required     all      lefthook                    brew install lefthook
required     flutter  fvm                         brew tap leoafarias/fvm && brew install fvm
recommended  all      semgrep                     brew install semgrep
recommended  all      claude                      https://docs.claude.com/en/docs/claude-code/setup
recommended  all      plugin:security-guidance    claude plugin install security-guidance@claude-plugins-official
recommended  all      plugin:superpowers          claude plugin install superpowers@claude-plugins-official

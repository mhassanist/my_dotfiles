# Static analysis rules. `fvm flutter analyze` runs them, and the pre-push hook blocks on errors.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unawaited_futures: warning
    use_build_context_synchronously: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_await_in_return

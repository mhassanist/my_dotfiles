# security_tools.conf: the tooling this repo requires on every dev machine.
# Edit this file when requirements change. Checked by `ai-setup` (~/.ai-msaudi/ai-setup).
#
# Format (pipe-separated, one rule per line):
#   TYPE | MODE | TOOLS | WHEN
#
# TYPE  A label for the group, shown in the report (secrets, hooks, plugins...).
# MODE  all  = every tool listed must be present
#       any  = at least one tool listed must be present
#       want = recommended: a missing tool prints WARN and does not fail the check
# TOOLS Space-separated. A bare name is a command that must be on PATH.
#       plugin:<name>[@<marketplace>] = Claude Code plugin enabled in ~/.claude/settings.json,
#       .claude/settings.json or .claude/settings.local.json. ai-setup can install it;
#       the marketplace defaults to claude-plugins-official.
# WHEN  always
#       has:<globs>  rule applies only if a matching file exists in the repo
#                    (up to 3 folders deep), e.g. has:*.py pyproject.toml
#
# "Must have A and B" = one `all` rule listing both. "At least one of X, Y" = one `any` rule.

# TYPE     | MODE | TOOLS                    | WHEN
secrets    | all  | gitleaks                 | always
hooks      | all  | lefthook                 | always

# Claude Code only: warn, never fail, so engineers on other agents aren't blocked.
plugins    | want | plugin:security-guidance | has:.claude CLAUDE.md
workflow   | want | plugin:superpowers       | has:.claude CLAUDE.md

# Add once a hook or CI step actually runs it (requiring an unused tool is just friction):
# sast       | all  | semgrep                  | always
# dependency | any  | osv-scanner trivy grype  | always

# Third Claude plugin: uncomment once named.
# plugins3   | want | plugin:<name>            | has:.claude CLAUDE.md

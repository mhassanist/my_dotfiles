# Git hooks. One-time setup per machine: `brew install lefthook gitleaks`
# One-time setup per clone (from the repo root): `lefthook install`
# Only free, deterministic checks run here. The full AI review stays a
# deliberate step before opening a PR.
# Hooks run in plain `sh`: shell aliases from ~/.zshrc don't exist here.

min_version: 1.10.0

# ── commit-msg: hint only (doesn't block) toward Conventional Commits ────────
commit-msg:
  commands:
    conventional-commit:
      run: |
        msg=$(head -n1 "{1}")
        case "$msg" in "Merge "*|"Revert "*|"fixup! "*|"squash! "*) exit 0 ;; esac
        printf '%s' "$msg" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9_./-]+\))?!?: .+' \
          || printf '\033[1;33mTip: use Conventional Commits, e.g. "feat(auth): add login"\033[0m\n'
        exit 0

# ── pre-commit: secrets in what's being committed ─────────────────────────────
pre-commit:
  commands:
    secrets-staged:
      run: gitleaks git --staged --no-banner --redact

# ── pre-push: secrets, tests, then the review reminder ───────────────────────
pre-push:
  jobs:
    - name: secrets-in-repo
      # Every commit being pushed (not yet on any remote).
      run: gitleaks git --no-banner --redact --log-opts="HEAD --not --remotes"
    - name: test
      run: @@TEST@@
    - name: ai-review-reminder
      run: >-
        printf "\n\033[1;33m⚡ Run an AI code review (e.g. /code-review in Claude Code) before opening a PR.\033[0m\n\n"
